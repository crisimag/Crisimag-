name: Generar lista.json automático

on:
  push:
    paths:
      - 'Carpeta/**'

jobs:
  generar-lista:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Generar lista.json con Python
        run: |
          python3 << 'EOF'
          import os
          import json

          carpeta = "Carpeta"
          extensiones = {'.jpg', '.jpeg', '.png', '.gif', '.webp', '.mp4', '.mov', '.webm', '.mkv', '.avi', '.heic', '.heif', '.avif'}

          archivos = []
          for root, dirs, files in os.walk(carpeta):
              for f in files:
                  ext = os.path.splitext(f)[1].lower()
                  if ext in extensiones and f != 'lista.json':
                      # Ruta relativa desde "Carpeta/"
                      ruta_completa = os.path.join(root, f)
                      ruta_relativa = os.path.relpath(ruta_completa, carpeta)
                      archivos.append(ruta_relativa)

          # Ordenar alfabéticamente inverso (más reciente primero si usas fechas)
          archivos.sort(reverse=True)

          with open(os.path.join(carpeta, 'lista.json'), 'w', encoding='utf-8') as out:
              json.dump(archivos, out, indent=2, ensure_ascii=False)

          print(f"✅ lista.json generado con {len(archivos)} archivos")
          EOF

      - name: Subir lista.json actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Carpeta/lista.json
          git diff --staged --quiet || git commit -m "🤖 Auto-generar lista.json"
          git push
