name: Generar lista.json automático

on:
  push:
    paths:
      - 'Carpeta/**'

jobs:
  generar-lista:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar lista.json con fecha y hora
        run: |
          python3 << 'EOF'
          import os
          import json
          import subprocess

          carpeta = "Carpeta"
          extensiones = {'.jpg', '.jpeg', '.png', '.gif', '.webp', '.mp4', '.mov', '.webm', '.mkv', '.avi', '.heic', '.heif', '.avif'}

          archivos = []
          for root, dirs, files in os.walk(carpeta):
              for f in files:
                  ext = os.path.splitext(f)[1].lower()
                  if ext in extensiones and f != 'lista.json':
                      ruta_completa = os.path.join(root, f)
                      ruta_relativa = os.path.relpath(ruta_completa, carpeta)
                      
                      # Obtener fecha y hora del último commit (formato ISO 8601)
                      try:
                          result = subprocess.run(
                              ['git', 'log', '-1', '--format=%ci', '--', ruta_completa],
                              capture_output=True, text=True, check=True
                          )
                          fecha_commit = result.stdout.strip()
                          # "2026-10-10 14:30:22 +0000" → "2026-10-10T14:30:22"
                          if fecha_commit:
                              partes = fecha_commit.split(' ')
                              fecha_hora = f"{partes[0]}T{partes[1]}"
                          else:
                              fecha_hora = 'sin-fecha'
                      except:
                          fecha_hora = 'sin-fecha'
                      
                      archivos.append({
                          'name': ruta_relativa,
                          'date': fecha_hora
                      })

          # Ordenar por fecha+hora (más reciente primero)
          archivos.sort(key=lambda x: x['date'], reverse=True)

          with open(os.path.join(carpeta, 'lista.json'), 'w', encoding='utf-8') as out:
              json.dump(archivos, out, indent=2, ensure_ascii=False)

          print(f"✅ lista.json generado con {len(archivos)} archivos")
          EOF

      - name: Subir lista.json actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Carpeta/lista.json
          git diff --staged --quiet || git commit -m " Auto-generar lista.json con fecha y hora"
          git push
